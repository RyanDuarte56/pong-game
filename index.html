<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong🏓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="score-div">
    <p id="score">First to score 10 points wins the game!</p>
  </div>
  <div id="canvas-div">
    <canvas id="canvas"></canvas>
    <button id="play-button">Play</button>
    <p id="win-message" class="hidden"></p>
    <button id="new-game-button" class="hidden">New Game</button>
  </div>
  <div id="controls-message-div">
    <p>&#8226 Controls:</p>
    <p>Left paddle - W/S keys</p>
    <p>Right paddle - Up/Down arrows</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
